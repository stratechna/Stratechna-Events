name: Versão nova do Hi.Events

# A imagem não se actualiza sozinha. Isto só avisa, com um issue, quando o
# Hi.Events publica uma versão diferente da que está fixada no Dockerfile.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FIXADA=$(sed -nE 's/^ARG HIEVENTS_VERSION=(.+)$/\1/p' Dockerfile)
          NOVA=$(gh release list --repo HiEventsDev/Hi.Events --limit 1 --json tagName -q '.[0].tagName')
          echo "fixada: $FIXADA | upstream: $NOVA"
          [ -n "$NOVA" ] && [ "$NOVA" != "$FIXADA" ] || exit 0
          TITULO="Hi.Events $NOVA disponível (fixado em $FIXADA)"
          [ "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number -q length)" = "0" ] || exit 0
          gh issue create --title "$TITULO" --body "Notas: https://github.com/HiEventsDev/Hi.Events/releases/tag/$NOVA
          Imagem: https://hub.docker.com/r/daveearley/hi.events-all-in-one/tags

          Para actualizar:
          1. Mudar \`ARG HIEVENTS_VERSION\` no Dockerfile e fazer push.
          2. O build falha se alguma troca do \`branding/aplicar.py\` deixar de encaixar; a verificação falha se Hi.Events aparecer fora da atribuição, ou se a atribuição desaparecer. Ajustar os padrões — nunca copiar bundles compilados do upstream.
          3. Mudança de versão menor (ex. 1.9 → 1.11): os clientes seguem a tag \`1.9\` e não mudam sozinhos. Backup, testar, mudar a tag nos compose."
